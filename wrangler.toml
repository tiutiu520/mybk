# Cloudflare Workers configuration for mybk / iori-nav.
# Replace the two resource IDs with your Cloudflare D1/KV resource IDs.
# Resource IDs are identifiers, not API secrets. Never put API tokens in this file.

name = "mybk"
main = "worker.js"
compatibility_date = "2026-09-07"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker must handle /, /admin/* and /api/* before static assets.
run_worker_first = ["/", "/admin*", "/api/*"]

[build]
command = "npm run build:css"

[[d1_databases]]
binding = "NAV_DB"
database_name = "book"
database_id = "1945d45d-6847-4b53-ba51-4b6f2b850d8f"

[[kv_namespaces]]
binding = "NAV_AUTH"
id = "a65aa4993536408fb28e892130b35ce9"

[vars]
ENABLE_PUBLIC_SUBMISSION = false
SITE_NAME = "灰色轨迹"
SITE_DESCRIPTION = "一个优雅、快速、易于部署的书签（网址）收藏与分享平台，完全基于 Cloudflare 全家桶构建"
FOOTER_TEXT = "曾梦想仗剑走天涯"
ICON_API = "https://faviconsnap.com/api/favicon?url="
AI_REQUEST_DELAY = "1500"

# Optional: configure Turnstile.
TURNSTILE_SITE_KEY = ""
TURNSTILE_SECRET_KEY = ""

# Optional: enable Cloudflare Workers AI.
# [ai]
# binding = "AI"
# remote = false
